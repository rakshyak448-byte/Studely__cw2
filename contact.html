<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Studely</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <img src="image/studelylogo.png" alt="Studely Logo">
        </div>
        <nav class="navigation">
            <a href="main.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container" style="max-width: 600px;">
        <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h1 style="color:#1e3a8a; margin-bottom: 20px;">Contact Us</h1>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required aria-required="true">
                    <span class="error-msg" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required aria-required="true">
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
                    <span class="error-msg" id="messageError"></span>
                </div>

                <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 6px;">
                    <p>Studely would like to send updates on new academic facilities[cite: 1]. You can modify preferences anytime[cite: 1].</p>
                    <label style="margin-top: 6px; display: block;"><input type="checkbox" name="comm"> Email Updates</label>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">Submit</button>
            </form>

            <div id="submissionOutput"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Studely. All rights reserved.</p>
    </footer>

</body>
</html>
