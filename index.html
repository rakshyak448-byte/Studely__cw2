<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Studely</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="image/studelylogo.png" alt="Studely logo" style="max-width: 140px;">
        </div>

        <h3 style="text-align: center; margin-bottom: 24px; color: #1e3a8a;">Log In</h3>

        <!-- Added id="login-form" and removed onsubmit inline attribute -->
        <form id="login-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username or Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">LOG IN</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b;">
            Don't have an account? <a href="signup.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">Sign up</a>
        </p>
    </div>

    <!-- Added link to main.js -->
    <script src="js/main.js"></script>
</body>
</html>
