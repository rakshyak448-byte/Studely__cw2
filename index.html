<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studely</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="form-container">
        < class="logo-container">divtudelylogo.png" alt="Studely logo">
        </div>
 <p>dawefe</p>
        <div class="form-header">
            <h3>Log In</h3>
        </div>

        <form onsubmit="return checkLogin()">
            <div class="input-container">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>

            <div class="button">
                <button class="submit" type="submit">LOG IN</button>
            </div>
        </form>

        <div class="signup">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script>
        function checkLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "" || password === "") {
                showAlert("Please fill in both fields!");
            } else if (username === "admin" && password === "1234") {
                showAlert("Welcome, " + username + "! Login successful.");
            } else {
                showAlert("Wrong username or password. Try again.");
            }

            return false; // stops the form from actually submitting/refreshing the page
        }

        function showAlert(message) {
            alert(message);
        }
    </script>

</body>
</html>
